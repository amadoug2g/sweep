name: Feature Request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for thinking about how Sweep could be better.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the current pain point or gap you're hitting.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement in as much detail as is useful.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - File organization / sorting logic
        - Claude intelligence / rules
        - Memory and learning
        - UI / menu bar
        - Settings / configuration
        - Performance
        - CI / build
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important
        - Blocking my use of Sweep
    validations:
      required: true
