name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v --enable-code-coverage

      - name: Generate coverage report
        run: |
          xcrun llvm-cov export -format=lcov \
            .build/debug/SweepPackageTests.xctest/Contents/MacOS/SweepPackageTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            > coverage.lcov 2>/dev/null || echo "Coverage report generation skipped (optional)"

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.lcov
          fail_ci_if_error: false
          verbose: true
